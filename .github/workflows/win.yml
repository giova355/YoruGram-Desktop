name: YoruGram Windows x64 test

on:
  push:
    branches: [yoru/foundation]
  workflow_dispatch:
    inputs:
      use_project_api:
        description: Build with the project's Telegram API credentials
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      REPO_PATH: TBuild/YoruGram-Desktop
      USE_PROJECT_API: ${{ inputs.use_project_api == true || (github.event_name == 'push' && vars.YORU_CI_PROJECT_API == 'true') }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Check API configuration
        if: env.USE_PROJECT_API == 'true'
        shell: pwsh
        env:
          YORU_API_ID: ${{ secrets.YORU_API_ID }}
          YORU_API_HASH: ${{ secrets.YORU_API_HASH }}
        run: |
          if ([string]::IsNullOrEmpty($env:YORU_API_ID)) { throw 'The YORU_API_ID secret is missing.' }
          if ([string]::IsNullOrEmpty($env:YORU_API_HASH)) { throw 'The YORU_API_HASH secret is missing.' }
          if ($env:YORU_API_ID -notmatch '^[1-9][0-9]{0,9}\z' -or [long]$env:YORU_API_ID -gt [int]::MaxValue) {
            throw 'YORU_API_ID must be a positive 32-bit integer.'
          }
          if ($env:YORU_API_HASH -notmatch '^[a-fA-F0-9]{32}\z') {
            throw 'YORU_API_HASH must be 32 hexadecimal characters.'
          }

      - name: Clean up preinstalled software.
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          Get-Service docker -ErrorAction SilentlyContinue | Stop-Service -ErrorAction SilentlyContinue
          wsl --shutdown 2> $null
          Remove-Item "C:\Android\android-sdk", "C:\Program Files\dotnet", "C:\Miniconda", "C:\msys64", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:LOCALAPPDATA\Docker", "C:\ProgramData\DockerDesktop", "C:\Program Files\PostgreSQL", "C:\PostgreSQL", "C:\Program Files\MongoDB", "C:\Program Files\MySQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup", "C:\cabal", "C:\Program Files\LLVM", "C:\vcpkg", "C:\tools\kotlinc", "C:\tools\php", "C:\tools\Apache24", "C:\tools\nginx-*", "C:\selenium", "C:\SeleniumWebDrivers", "C:\Program Files\R", "C:\Program Files (x86)\R", "C:\rtools*", "C:\Program Files\Google\Chrome*", "C:\Program Files (x86)\Google\Chrome*", "C:\Program Files\Mozilla Firefox*", "C:\ProgramData\Package Cache" -Recurse -Force -ErrorAction SilentlyContinue
          # The _Instances registry is how vswhere finds Visual Studio.
          Get-ChildItem "C:\ProgramData\Microsoft\VisualStudio\Packages" -Exclude _Instances -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item C:\hostedtoolcache\windows\Go*, C:\hostedtoolcache\windows\Ruby*, C:\hostedtoolcache\windows\PyPy*, C:\hostedtoolcache\windows\Java_*, C:\hostedtoolcache\windows\NuGet* -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ('{0:N1} GB -> {1:N1} GB free' -f $before, ((Get-PSDrive C).Free / 1GB))
          exit 0

      - name: Prepare directories.
        run: |
          mkdir "%GITHUB_WORKSPACE%\TBuild\Libraries\win64"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>"%GITHUB_ENV%"
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>"%GITHUB_ENV%"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_PATH }}
          persist-credentials: false

      - name: First set up.
        shell: bash
        run: |
          SDK="$(sed -nE 's/.*\*\*([0-9.]+)\*\* SDK version.*/\1/p' "$REPO_PATH/docs/building-win.md")"
          test -n "$SDK"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          sha256sum "$REPO_PATH/$PREPARE_PATH" "$REPO_PATH/Telegram/build/qt_version.py" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore prepared dependencies
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-x64-debug-dependencies-${{ env.CACHE_KEY }}

      - name: Libraries.
        working-directory: ${{ env.REPO_PATH }}
        run: |
          set "CARGO_INCREMENTAL=0"
          call Telegram\build\prepare\win.bat skip-release silent

      - name: Cache prepared dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.LibrariesPath }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Compile YoruGram Desktop
        env:
          YORU_API_ID: ${{ env.USE_PROJECT_API == 'true' && secrets.YORU_API_ID || '' }}
          YORU_API_HASH: ${{ env.USE_PROJECT_API == 'true' && secrets.YORU_API_HASH || '' }}
        working-directory: ${{ env.REPO_PATH }}/Telegram
        run: |
          @echo off
          if "%USE_PROJECT_API%"=="true" (
            set "API_OPTIONS=-D TDESKTOP_API_TEST=OFF -D TDESKTOP_API_ID=%YORU_API_ID% -D TDESKTOP_API_HASH=%YORU_API_HASH%"
          ) else (
            set "API_OPTIONS=-D TDESKTOP_API_TEST=ON"
          )
          call configure.bat x64 %API_OPTIONS% -D CMAKE_CONFIGURATION_TYPES=Debug -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Debug --target Telegram --parallel

      - name: Package Windows test executable
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE $env:REPO_PATH
          $exe = Join-Path $root 'out\Debug\YoruGram.exe'
          if (-not (Test-Path $exe)) { throw 'YoruGram.exe missing' }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $exe artifact
          Copy-Item (Join-Path $root 'LICENSE'), (Join-Path $root 'LEGAL') artifact
          (Get-FileHash artifact\YoruGram.exe -Algorithm SHA256).Hash | Set-Content artifact\SHA256.txt
      - uses: actions/upload-artifact@v7
        if: env.USE_PROJECT_API != 'true' || github.event.repository.private
        with:
          name: YoruGram-Windows-x64-${{ env.USE_PROJECT_API == 'true' && 'project-api-test' || 'telegram-test-api' }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Launch YoruGram with a fresh Windows profile
        if: env.USE_PROJECT_API != 'true'
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifact\YoruGram.exe').Path
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'yorugram-test-profile'
          New-Item -ItemType Directory $env:APPDATA -Force | Out-Null
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "YoruGram exited with code $($process.ExitCode)." }
            } until ($process.MainWindowHandle -ne [IntPtr]::Zero -or (Get-Date) -ge $deadline)
            if ($process.MainWindowHandle -eq [IntPtr]::Zero) { throw 'YoruGram showed no main window.' }
            $data = Join-Path $env:APPDATA 'YoruGram Desktop\tdata'
            if (-not (Test-Path -LiteralPath $data -PathType Container)) { throw 'YoruGram data directory is missing.' }
            Write-Host "YoruGram opened a window and created its own data directory."
          } finally {
            if (-not $process.HasExited) {
              [void]$process.CloseMainWindow()
              if (-not $process.WaitForExit(5000)) { Stop-Process -Id $process.Id }
            }
          }

      - name: Build and verify the Windows test installer
        if: env.USE_PROJECT_API != 'true'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $repo = Join-Path $env:GITHUB_WORKSPACE $env:REPO_PATH
          $script = Join-Path $repo 'yoru-build\windows\YoruGram-Test.iss'
          $payload = (Resolve-Path artifact).Path
          $output = Join-Path $env:GITHUB_WORKSPACE 'installer'
          New-Item -ItemType Directory -Force $output | Out-Null
          & $iscc "/DPayload=$payload" "/O$output" $script
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          $target = Join-Path $env:RUNNER_TEMP 'yoru-setup-test'
          $setup = Join-Path $output 'YoruGram-Setup-Test.exe'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Test installer exited with code $($install.ExitCode)." }
          $installedExe = Join-Path $target 'YoruGram.exe'
          if ((Get-FileHash $installedExe).Hash -ne (Get-FileHash (Join-Path $payload 'YoruGram.exe')).Hash) {
            throw 'The installed executable differs from the tested executable.'
          }
          $uninstaller = Join-Path $target 'unins000.exe'
          $uninstall = Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $installedExe)) { throw 'Test uninstall failed.' }
          (Get-FileHash $setup -Algorithm SHA256).Hash | Set-Content (Join-Path $output 'SHA256.txt')
      - uses: actions/upload-artifact@v7
        if: env.USE_PROJECT_API != 'true'
        with:
          name: YoruGram-Windows-x64-test-installer
          path: installer/
          if-no-files-found: error
          retention-days: 14
