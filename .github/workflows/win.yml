        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-

      - name: Libraries.
        run: |
          set CARGO_INCREMENTAL=0
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Compile YoruGram Desktop
        env:
          YORU_API_ID: ${{ secrets.YORU_API_ID }}
          YORU_API_HASH: ${{ secrets.YORU_API_HASH }}
        run: |
          cd /d "%TBUILD%\%REPO_NAME%\Telegram"
          call configure.bat x64 -D TDESKTOP_API_ID=%YORU_API_ID% -D TDESKTOP_API_HASH=%YORU_API_HASH% -D CMAKE_CONFIGURATION_TYPES=Debug -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Debug --parallel
          if errorlevel 1 exit /b 1

      - name: Package Windows test executable
        shell: pwsh
        run: |
          $root = Join-Path $env:TBUILD $env:REPO_NAME
          $exe = Join-Path $root 'out\Debug\YoruGram.exe'
          if (-not (Test-Path $exe)) { throw 'YoruGram.exe missing' }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $exe artifact
          Copy-Item (Join-Path $root 'LICENSE') artifact
          (Get-FileHash artifact\YoruGram.exe -Algorithm SHA256).Hash | Set-Content artifact\SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: YoruGram-Windows-x64-test
          path: artifact/
          if-no-files-found: error
          retention-days: 7
